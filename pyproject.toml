[project]
name = "twocrypto-cpp"
version = "0.1.0"
description = "Checkout-local header-only TwoCrypto pool with exact Vyper parity route"
requires-python = ">=3.12,<3.13"
dependencies = [
  "titanoboa==0.2.8",
  "vyper==0.4.3",
  "snekmate==0.1.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
twocrypto-parity = "twocrypto_parity.cpp_pool_runner:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
include = ["twocrypto_parity*"]

[tool.setuptools.package-data]
"twocrypto_parity.vyper_pool" = ["*.vy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-ra"
